<!DOCTYPE html>
<html>

<head>
    <title>calculator</title>

    <link rel="stylesheet" href="./style.css" rel="style css">

</head>

<body>
    <h1>Calculator</h1>
    <div class="color ">Display: <span id="display"></span></div>
    <div class="color">Result: <span id="result"></span></div>
    <div class="calc-container">
        <div class="calc-number" onclick="appendValue()"></div>


        <div class="calc-number" onclick="appendValue(0)">0</div>
        <div class="calc-number" onclick="appendValue(1)">1</div>
        <div class="calc-number" onclick="appendValue(2)">2</div>
        <div class="calc-number" onclick="appendValue(3)">3</div>
        <div class="calc-number" onclick="appendValue(4)">4</div>
        <div class="calc-number" onclick="appendValue(5)">5</div>
        <div class="calc-number" onclick="appendValue(6)">6</div>
        <div class="calc-number" onclick="appendValue(7)">7</div>
        <div class="calc-number" onclick="appendValue(8)">8</div>
        <div class="calc-number" onclick="appendValue(9)">9</div>
        <div class="calc-number" onclick="appendValue('+')">+</div>
        <div class="calc-number" onclick="appendValue('-')">-</div>
        <div class="calc-number" onclick="appendValue('*')">*</div>
        <div class="calc-number" onclick="appendValue('/')">/</div>


        <div class="calc-number" onclick="calculateValue()">=</div>
        <div class="calc-number" onclick="clearValue()">clear</div>
    </div>


    <script src="./script.js"></script>
</body>

</html>
